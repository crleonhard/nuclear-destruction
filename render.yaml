# Render Blueprint: describes the web service so it can be created in one step (New > Blueprint, pointing at this repository).
# The database is NOT created here: it lives on Aiven (see README, "Deploying"). Values marked sync: false are asked for
# in the Render dashboard the first time, and are never stored in this file.
services:
  - type: web
    name: nuclear-destruction
    runtime: node
    # Free plan: no card needed for a manually created service, but Render may ask for one when applying a Blueprint (see README >
    # Deploying). A free service sleeps after 15 idle minutes, and the turn-deadline timer sleeps with it; "starter" stays awake.
    # Email on the free plan must use SMTP port 2525 (Render blocks 25, 465 and 587 there).
    plan: free
    buildCommand: npm install && npm run migrate -- up   # also brings the database schema up to date on every deploy
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true                 # Render creates a random secret once. Changing it signs everyone out.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip             # Render sits behind Cloudflare; this is the visitor's real address (for rate limits)
      - key: NODE_EXTRA_CA_CERTS
        value: certs/aiven-ca.pem           # Aiven's public ca.pem, committed to this repository (see certs/README.md)
      - key: DATABASE_URL
        sync: false                         # the Aiven Service URI
      - key: APP_URL
        sync: false                         # this service's public address, e.g. https://nuclear-destruction.onrender.com
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional: opt-in turn emails use the same mail settings. Defaults shown; remove the comment marks to change them.
      # - key: NOTIFY_REMINDER_HOURS
      #   value: "4"
      # - key: NOTIFY_DAILY_LIMIT
      #   value: "150"                      # Mailjet free allows 200 a day in total, sign-in links included
